map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 2053;
    server_name _;

    client_max_body_size 64m;
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    # Health probe for hosting platforms (HTTP only inside the container).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # VLESS + WebSocket inbound (port 8081, path /ws, TLS at the platform edge).
    location ~ ^/ws(?:/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 3X-UI subscription server.
    location ~* ^/(?:sub|json|clash|mihomo|clash-legacy|loc)/ {
        proxy_pass http://127.0.0.1:2096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # The real panel lives only under /parham (panel Web Base Path must be /parham/).
    location /parham {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Everything else: the bat game, served with a 404 status so the
    # domain looks like an empty / not-found site.
    location / {
        return 404;
    }
    error_page 404 /__parham_game;
    location = /__parham_game {
        internal;
        root /app/hidden;
        rewrite ^ /game.html break;
        add_header Cache-Control "no-store" always;
    }
}
